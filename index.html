<html>
<head>
    <title>Home | Schoology</title>
    <link rel="shortcut icon" type="image/png" href="https://resources.finalsite.net/images/f_auto,q_auto/v1626100427/k12albemarleorg/uj41eppe27bunrvhwnep/PowerSchoolLogos_Vertical-01.png">
    
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      
      #game-container {
        position: relative;
        width: 1080px;
        height: 480px;
        margin-top: 10px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid #ccc;
      }

      #pooopoverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }

      #pooopoverlay img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #pooopoverlay[hidden] {
        display: none;
      }
    </style>
</head>
<body>

    <h1>Welcome to Schoology</h1>
    <p>Press <strong>Enter</strong> at any time to toggle the Schoology screen (which hides the game).</p>
    
    <div id="game-container">
        <iframe id="game-frame" src="https://geometrydash.com" width="1080" height="480"></iframe>
    </div>

    <div id="pooopoverlay" role="img" aria-label="Schoology Screen" hidden>
        <img src="pooop.png" alt="Schoology" />
    </div>

    <script>
    (() => {
        const overlay = document.getElementById("pooopoverlay");
        const gameFrame = document.getElementById("game-frame");

        window.addEventListener("keydown", (event) => {
            if ((event.code !== "Enter" && event.code !== "NumpadEnter") || event.repeat) return;
            
            event.preventDefault();
            
            overlay.hidden = !overlay.hidden;

            if (!overlay.hidden) {
                gameFrame.dataset.src = gameFrame.src;
                gameFrame.src = "";
            } else {
                if (gameFrame.dataset.src) {
                    gameFrame.src = gameFrame.dataset.src;
                }
            }
        });
    })();
    </script>
</body>
</html>
