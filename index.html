    <html>
    <body>
    <title>Home | Schoology</title>
    <h1>GD</h1>
    <iframe src="https://geometrydash.com " width="1080" height="480"></iframe>

                <canvas id="screen"></canvas>
                           <div id="ui"></div>
                                   <div id="transition-layer"></div>

                                           <div id="pooopoverlay" role="img" aria-label="pppoooooooop">
                                                   <img src="pooop.png" alt="this is totally schoology" />
                                                           </div>
		    <style>
      #pooopoverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
      }

      #pooopoverlay img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #pooopoverlay[hidden] {
        display: none;
      }
    </style>
                                                           <script>
(() => {
const overlay = document.getElementById("pooopoverlay");
	window.addEventListener("keydown", (event) => {
		if (event.code !== "Space" || event.repeat) return;
		event.preventDefault();
		overlay.hidden = !overlay.hidden;
	});
})();
</script>
</body>

</html>
